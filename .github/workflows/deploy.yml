name: Publish
run-name: "Deploy edition: ${{ inputs.edition_date || 'scheduled' }} | recovery:${{ inputs.recovery_attempt || '0' }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_attempt:
        description: "Recovery monitor attempt"
        required: false
        type: choice
        default: "0"
        options: ["0", "1", "2"]
      edition_date:
        description: "Edition being recovered (for tracking only; deploys current main)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run check && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages for publication on merge
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
